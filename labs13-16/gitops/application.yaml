apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab14
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/teret457/devops-gitops.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: lab14
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
